# --- OpenCode Go ---
# https://opencode.ai/v2/docs/console/go/
# Go is a subscription. Rows below retain $0 of estimated cash spend per token.
# Official allowance rates in USD/1M: input / read / write / output.
# Kimi K3.1 Pro: 2 / 0.20 / 2 / 10.
# DeepSeek V4 Pro: 1.32 / 0.044 / — / 3.96 (peak), 0.66 / 0.022 / — / 1.98 (off-peak).
# DeepSeek V4.1 Flash: 0.30 / 0.006 / — / 1.20 (peak), 0.15 / 0.003 / — / 0.60 (off-peak).
# GLM-5.3: 1.40 / 0.26 / — / 4.40.
# GPT-6 Luna: 0.10 / 0.01 / 0.125 / 0.50 (≤272K), 0.20 / 0.02 / 0.25 / 0.75 (>272K).
