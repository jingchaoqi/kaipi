# USD per million tokens, verified 2026-11-27. CNY rates use 6.7075 CNY/USD.
# The ledger uses one rate per token category. Source and alternative tiers are noted below.
# Unknown models cost 0 and the CLI warns.
# Set your own rates in .kaipi/pricing.toml or ~/.config/kaipi/pricing.toml if that matters.
#
# A model names its provider; a provider is a wire protocol + endpoint + key env var.
# Built-in providers: anthropic, openai (Responses API), gemini; deepseek, kimi, glm, opencode,
# opencode-go each in an OpenAI-compatible form and an `-anthropic` (Messages API) form; plus
# qwen, openrouter, groq, ollama. Override or add under [providers].
# Any model not listed here can still be used as KAIPI_MODEL=<provider>/<model id>.
# <PROVIDER>_BASE_URL in the environment overrides a provider's base_url.

[defaults]
model = "claude-opus-5"
summary_model = "claude-haiku-4-5"
# `context` is the model's window, shown in the status bar next to the trunk burden.
# Omit it and the bar just leaves the window out.

[providers.vllm]            # example of a self-hosted OpenAI-compatible endpoint
api = "openai-chat"         # anthropic | openai-responses | openai-chat | gemini
base_url = "http://localhost:8000/v1"
api_key_env = "VLLM_API_KEY"

# --- Anthropic Messages ---
# https://platform.claude.com/docs/en/about-claude/pricing
# Writes use 5m. Haiku 5.5 over 100K: 0.50 input, 0.05 read, 0.625 write, 2.50 output.

[models."claude-fable-5-2"]
provider = "anthropic"
input = 8
cache_read = 0.2
cache_write = 10
output = 40
context = 1000000

[models."claude-opus-5-5"]
provider = "anthropic"
input = 4
cache_read = 0.2
cache_write = 5
output = 20
context = 1000000

[models."claude-sonnet-5-5"]
provider = "anthropic"
input = 2
cache_read = 0.1
cache_write = 2.5
output = 10
context = 1000000

[models."claude-haiku-5-5"]
provider = "anthropic"
input = 0.1
cache_read = 0.01
cache_write = 0.125
output = 0.5
context = 1000000

# --- OpenAI Responses ---
# https://developers.openai.com/api/docs/pricing
# Standard ≤272K, 30m cache writes. For >272K, input/cache rates double, output is 1.5x.
# The 12h write rate is 2x the 30m write rate.

[models."gpt-6.2-astra"]
provider = "openai"
input = 8
cache_read = 0.4
cache_write = 10
output = 40
context = 1050000

[models."gpt-6.2-sol"]
