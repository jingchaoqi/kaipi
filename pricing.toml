# USD per million tokens. Four explicit prices per model: cache economics are NOT a constant
# multiple (Fable 5.1 reads at 0.025x, 1h-TTL writes at 2x), so no multipliers here.
# Anthropic prices as of 2026-06; OpenAI prices as of 2025-08 - verify before trusting the ledger.

[defaults]
model = "claude-opus-5"
summary_model = "claude-haiku-4-5"

[models."claude-fable-5-1"]
provider = "anthropic"
input = 10.0
cache_write = 12.5
cache_read = 0.25
output = 50.0

[models."claude-opus-5"]
provider = "anthropic"
input = 5.0
cache_write = 6.25
cache_read = 0.5
output = 25.0

[models."claude-sonnet-5"]
provider = "anthropic"
input = 2.0
cache_write = 2.5
cache_read = 0.2
output = 10.0

[models."claude-sonnet-4-6"]
provider = "anthropic"
input = 3.0
cache_write = 3.75
cache_read = 0.3
output = 15.0

[models."claude-haiku-4-5"]
provider = "anthropic"
adaptive_thinking = false
input = 1.0
cache_write = 1.25
cache_read = 0.1
output = 5.0

[models."gpt-5"]
provider = "openai"
input = 1.25
cache_write = 0.0
cache_read = 0.125
output = 10.0

[models."gpt-5-mini"]
provider = "openai"
input = 0.25
cache_write = 0.0
cache_read = 0.025
output = 2.0

[models."gpt-4.1"]
provider = "openai"
input = 2.0
cache_write = 0.0
cache_read = 0.5
output = 8.0
