[project]
name = "kaipi"
version = "0.1.0"
description = "A tiny, token-frugal coding agent that organises exploration as a DAG."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "anthropic>=1.3",
    # [socks]: httpx raises at client construction, before any request, when the
    # environment names a socks5 proxy and socksio is absent. It is imported only on
    # that path, so a user without a proxy pays nothing but the download.
    "httpx[socks]>=0.28",
    "pydantic>=2.11",
    "python-ulid>=3",
    "typer>=0.15",
]

[project.scripts]
kaipi = "kaipi.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaipi"]
artifacts = ["kaipi/canvas.html", "kaipi/pricing.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# CLAUDE.md is the startup prompt verbatim; its code blocks are documentation, not source
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "scripts"  # tests import the mock endpoint and the smoke harness

[tool.pytest.ini_options]
testpaths = ["tests"]
